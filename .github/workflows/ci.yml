name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    uses: novami/minor-swift-core/.github/workflows/lint.yml@0.1.0

  test:
    uses: novami/minor-swift-core/.github/workflows/app-test.yml@0.1.0
    with:
      scheme: MinorSwiftStarter
