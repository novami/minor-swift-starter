included:
  - App
  - Core
  - Features
  - Tests

excluded:
  - .build
  - DerivedData

strict: false

opt_in_rules:
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - redundant_nil_coalescing
  - vertical_whitespace_closing_braces

disabled_rules:
  - trailing_comma

line_length:
  warning: 120
  error: 160

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 500
  error: 800

identifier_name:
  min_length: 2
  max_length: 50
  excluded: [i, j, x, y]
